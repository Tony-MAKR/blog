# 自动发布机器人
#
# 作用：每次你（或 Claude）把改动保存到 GitHub 后，这个机器人会自动：
#   1. 把文字文件「打印」成网页
#   2. 把网页发布到网站上
# 整个过程约 1-2 分钟，不需要任何人工操作。
#
# 在仓库的 Actions 标签页可以看到每次发布的结果：
#   绿色对勾 ✅ = 发布成功    红色叉号 ❌ = 发布失败（需要修复）

name: 自动发布博客

on:
  push:
    branches: ["main"] # 每次保存到 main 分支时触发
  workflow_dispatch: # 也可以在网页上手动点按钮触发

# 发布网页所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个发布任务在跑，避免互相覆盖
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 第一步：把文字文件生成网页
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v7

      - name: 准备运行环境
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装网站所需的组件
        run: npm ci

      - name: 生成网页
        run: npx hexo generate

      - name: 准备发布设置
        uses: actions/configure-pages@v6

      - name: 打包生成好的网页
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # 第二步：把网页发布到网站上
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布上线
        id: deployment
        uses: actions/deploy-pages@v5
